<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Funzo Stock Alerts</title>
    <link rel="stylesheet" href="./src/style.css" />
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  </head>
  <body>
    <div id="app">
      <!-- App Header -->
      <header id="app-header" class="glass">
        <div class="flex-row" style="padding: 16px 24px;">
          <div>
            <span class="label-sm">Funzo Stock Alerts</span>
            <h1 id="header-title" style="font-size: 1.5rem; letter-spacing: -0.01em;">Dashboard</h1>
          </div>
          <div id="search-trigger" class="btn btn-ghost" style="padding: 10px;">
            <i class="material-symbols-outlined">search</i>
          </div>
        </div>
        
        <!-- Search Dropdown (Minimal) -->
        <div id="search-dropdown" class="glass surface-high ghost-border" style="display: none; position: absolute; top: 100%; left: 16px; right: 16px; border-radius: var(--radius-lg); padding: 16px; z-index: 1000; margin-top: 8px;">
          <input type="text" id="stock-search" placeholder="Search Ticker (e.g. RELIANCE)..." 
                 style="width: 100%; background: var(--color-surface-low); border: var(--ghost-border); padding: 12px; border-radius: var(--radius-md); color: white; font-family: var(--font-utility); outline: none;">
          <div id="search-results" style="margin-top: 12px; max-height: 200px; overflow-y: auto;"></div>
        </div>
      </header>

      <!-- Page Content Content -->
      <main id="main-content">
        <div id="page-mount"></div>
      </main>

      <!-- Bottom Navigation -->
      <nav id="bottom-nav" class="bottom-nav glass">
        <a href="#" class="nav-item active" data-page="dashboard">
          <i class="material-symbols-outlined">analytics</i>
          <span>Markets</span>
        </a>
        <a href="#" class="nav-item" data-page="alerts">
          <i class="material-symbols-outlined">bolt</i>
          <span>Alerts</span>
        </a>
        <a href="#" class="nav-item" data-page="billing">
          <i class="material-symbols-outlined">account_balance_wallet</i>
          <span>Portal</span>
        </a>
        <a href="#" class="nav-item" data-page="profile">
          <i class="material-symbols-outlined">grid_view</i>
          <span>More</span>
        </a>
      </nav>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
